<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primario: #f17b21; /* Color naranja Kat Haus sugerido */
            --oscuro: #2d2d2d;
            --claro: #ffffff;
            --gris-fondo: #f9f9f9;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; color: var(--oscuro); }

        .hero-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            padding: 50px 5%;
            background-color: var(--gris-fondo);
            min-height: 80vh;
        }

        .hero-image {
            flex: 1;
            min-width: 300px;
            max-width: 600px;
            padding: 20px;
        }

        .hero-image img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .hero-text {
            flex: 1;
            min-width: 300px;
            padding: 40px;
        }

        .hero-text h1 {
            font-size: 2.5rem;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero-text span.highlight {
            color: var(--primario);
            font-weight: bold;
        }

        .hero-text p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #555;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--primario);
            color: var(--claro);
            padding: 18px 35px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            font-size: 1.1rem;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(241, 123, 33, 0.4);
        }

        .cta-button:hover {
            transform: translateY(-3px);
            background-color: #d66a1a;
        }

        .cta-subtext {
            display: block;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }

        @media (max-width: 768px) {
            .hero-text h1 { font-size: 1.8rem; }
            .hero-container { padding: 20px; text-align: center; }
        }
    </style>
</head>
<body>

    <section class="hero-container">
        <div class="hero-image">
            <img src="Problema.png" alt="Muebles dañados por gatos - Kat Haus">
        </div>

        <div class="hero-text">
        
            
            <p>Nuestros gatos necesitan trepar y explorar para ser felices. Creamos circuitos personalizados que salvan tus sofás y transforman la vida de tu gato.</p>

            <a href="#contacto" class="cta-button">EMPEZAR MI DISEÑO 3D GRATIS</a>
            
            <small class="cta-subtext">Diseños desde $150 USD adaptados a tu espacio.</small>
        </div>
    </section>

</body>
</html>
