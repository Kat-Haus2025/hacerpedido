<!DOCTYPE html>
<html lang="es">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TW42N1MHMF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TW42N1MHMF');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kat Haus | Ingeniería de Bienestar Felino</title>
    <style>
        :root {
            --primario: #f17b21; 
            --oscuro: #1a1a1a;
            --texto-suave: #555;
            --blanco: #ffffff;
            --gris-claro: #f4f4f4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.4;
            color: var(--oscuro);
            background-color: var(--blanco);
        }

        /* NAVEGACIÓN COMPACTA CON LOGO NUEVO */
        nav {
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--blanco);
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-logo { display: flex; align-items: center; gap: 10px; }
        .nav-logo img { height: 40px; width: auto; }
        .nav-logo span { font-weight: bold; font-size: 1.1rem; letter-spacing: 1px; }

        /* HERO OPTIMIZADO PARA MÓVIL (SIN ESPACIO DESPERDICIADO) */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Empuja el contenido hacia arriba */
            text-align: center;
            padding: 30px 5% 10px; /* Reducción de padding inferior */
            background-color: var(--gris-claro);
            min-height: 85vh; /* Forzamos a que la siguiente sección suba y sea visible */
            position: relative;
        }

        .hero-text { margin-bottom: 20px; width: 100%; }
        .hero-text h1 { 
            font-size: 1.8rem; 
            line-height: 1.2; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
        }
        .hero-text p { font-size: 1rem; color: var(--texto-suave); margin-bottom: 0; }

        .hero-image { width: 100%; max-width: 450px; position: relative; }
        .hero-image img { 
            width: 100%; 
            height: auto; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        /* INDICADOR DE CONTINUIDAD */
        .scroll-hint {
            margin-top: 15px;
            color: var(--primario);
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: fadeInOut 2s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* SECCIÓN SIGUIENTE ASOMANDO */
        .authority { 
            padding: 50px 5%; 
            background: var(--blanco);
            box-shadow: 0 -20px 30px rgba(0,0,0,0.05); /* Sombra para dar profundidad al subir */
        }

        /* ... RESTO DE ESTILOS (Cards, CTA, Chat) SE MANTIENEN ... */

        @media (min-width: 769px) {
            .hero { flex-direction: row; min-height: 90vh; text-align: left; }
            .hero-text { flex: 1; padding-right: 5%; }
            .hero-image { flex: 1; }
            .hero-text h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">
            <img src="Logo_2026.jpg" alt="Kat Haus Logo">
            <span>KAT HAUS</span>
        </div>
        <div style="font-size: 0.7rem; color: #999;">QUITO, ECUADOR</div>
    </nav>

    <section class="hero">
        <div class="hero-text">
            <h1>¿Tienes un minino destructor?</h1>
            <p>Salva tu diseño interior con ingeniería de bienestar felino.</p>
        </div>
        
        <div class="hero-image">
            <img src="imagen.jpg" alt="Problema: muebles arañados">
        </div>

        <div class="scroll-hint">
            Desliza para ver la solución ↓
        </div>
    </section>

    <section class="authority">
        <h2 style="text-align: center; text-transform: uppercase; font-size: 1.4rem; margin-bottom: 30px;">
            Ingeniería que transforma tu hogar
        </h2>
        </section>

    </body>
</html>
