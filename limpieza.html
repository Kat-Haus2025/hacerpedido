<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sauber-Haus | Limpieza Profesional</title>
    <style>
        :root {
            --primary: #0071e3;
            --primary-hover: #0077ed;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --border-color: #d2d2d7;
            --radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 540px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 32px;
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            box-sizing: border-box;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
            font-weight: 400;
        }

        /* Banner estilo Apple (limpio y redondeado) */
        .banner-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            margin-bottom: 28px;
            object-fit: cover;
        }

        .service-group {
            margin-bottom: 14px;
            padding: 16px;
            background-color: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .service-group:hover {
            border-color: var(--primary);
            background-color: #ffffff;
        }

        .service-checkbox {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            gap: 12px;
        }

        .service-checkbox input {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            flex-shrink: 0;
            cursor: pointer;
        }

        .sub-options {
            margin-top: 14px;
            border-top: 1px solid #ebebf0;
            padding-top: 12px;
            display: none;
        }

        .sub-options.active {
            display: block;
        }

        .sub-options label {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .sub-options input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }

        .sub-options input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
        }

        .total-box {
            margin-top: 28px;
            padding: 20px;
            background-color: #f5f5f7;
            border-radius: 12px;
            text-align: center;
        }

        .total-box h3 {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .total-price {
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 4px 0 0 0;
            letter-spacing: -0.02em;
        }

        .btn-submit {
            display: block;
            width: 100%;
            margin-top: 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .disclaimer {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 16px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sauber-Haus</h1>
    <p class="subtitle">Selecciona los servicios que necesitas para tu hogar.</p>
    
    <!-- Imagen del banner -->
    <img src="wisholimpio.jpg" alt="Sauber-Haus Limpieza Profesional" class="banner-img">

    <form id="cotizadorForm">
        
        <!-- Opción 1: Juego de Sala -->
        <div class="service-group">
            <label class="service-checkbox">
                <span>🛋️ Juego de Sala (Base 7 puestos) — $35</span>
                <input type="checkbox" id="checkSala" onchange="toggleSub('salaOptions', this)">
            </label>
            <div id="salaOptions" class="sub-options">
                <label for="extraPuestos">¿Puestos adicionales? (+$5 c/u)</label>
                <input type="number" id="extraPuestos" value="0" min="0" max="10" oninput="calcularTotal()">
            </div>
        </div>

        <!-- Opción 2: Juego de Sillas -->
        <div class="service-group">
            <label class="service-checkbox">
                <span>🪑 Juego de Sillas (Hasta 6 puestos) — $25</span>
                <input type="checkbox" id="checkSillas" value="25" onchange="calcularTotal()">
            </label>
        </div>

        <!-- Opción 3: Colchón 2 Plazas -->
        <div class="service-group">
            <label class="service-checkbox">
                <span>🛏️ Colchón de 2 Plazas — $22</span>
                <input type="checkbox" id="checkColchon2P" value="22" onchange="calcularTotal()">
            </label>
        </div>

        <!-- Opción 4: Colchón King Size -->
        <div class="service-group">
            <label class="service-checkbox">
                <span>🛏️ Colchón King Size — $32</span>
                <input type="checkbox" id="checkColchonKing" value="32" onchange="calcularTotal()">
            </label>
        </div>

        <!-- Caja de Total -->
        <div class="total-box">
            <h3>Precio Estimado</h3>
            <p class="total-price" id="totalDisplay">$0</p>
        </div>

        <!-- Botón de Acción -->
        <button type="button" class="btn-submit" onclick="reservarCupo()">📅 Reservar vía WhatsApp</button>
        
        <!-- Disclaimer de disponibilidad -->
        <p class="disclaimer">
            * Los cupos se asignarán de acuerdo con la disponibilidad de agenda vigente.
        </p>
    </form>
</div>

<script>
    function toggleSub(id, checkbox) {
        const subOptions = document.getElementById(id);
        if (checkbox.checked) {
            subOptions.classList.add('active');
        } else {
            subOptions.classList.remove('active');
            document.getElementById('extraPuestos').value = 0; 
        }
        calcularTotal();
    }

    function calcularTotal() {
        let total = 0;

        const checkSala = document.getElementById('checkSala');
        if (checkSala.checked) {
            let baseSala = 35;
            let extraPuestos = parseInt(document.getElementById('extraPuestos').value) || 0;
            total += baseSala + (extraPuestos * 5);
        }

        const checkSillas = document.getElementById('checkSillas');
        if (checkSillas.checked) {
            total += parseInt(checkSillas.value);
        }

        const checkColchon2P = document.getElementById('checkColchon2P');
        if (checkColchon2P.checked) {
            total += parseInt(checkColchon2P.value);
        }

        const checkColchonKing = document.getElementById('checkColchonKing');
        if (checkColchonKing.checked) {
            total += parseInt(checkColchonKing.value);
        }

        document.getElementById('totalDisplay').innerText = '$' + total;
    }

    function reservarCupo() {
        let total = document.getElementById('totalDisplay').innerText;
        if (total === '$0') {
            alert('Por favor selecciona al menos un servicio para continuar.');
            return;
        }
        
        let detalleItems = [];
        
        const checkSala = document.getElementById('checkSala');
        if (checkSala.checked) {
            let extraPuestos = parseInt(document.getElementById('extraPuestos').value) || 0;
            let descSala = "- Juego de Sala (Base 7 puestos)";
            if (extraPuestos > 0) {
                descSala += ` con ${extraPuestos} puesto(s) adicional(es)`;
            }
            detalleItems.push(descSala);
        }

        const checkSillas = document.getElementById('checkSillas');
        if (checkSillas.checked) {
            detalleItems.push("- Juego de Sillas (Hasta 6 puestos) ($25)");
        }

        const checkColchon2P = document.getElementById('checkColchon2P');
        if (checkColchon2P.checked) {
            detalleItems.push("- Colchón de 2 Plazas ($22)");
        }

        const checkColchonKing = document.getElementById('checkColchonKing');
        if (checkColchonKing.checked) {
            detalleItems.push("- Colchón King Size ($32)");
        }

        let mensaje = `Hola! Quiero reservar el servicio de Sauber-Haus con los siguientes detalles:\n\n` +
                    detalleItems.join('\n') + `\n\n` +
                    `*Precio Estimado Total: ${total}*`;

        let mensajeCodificado = encodeURIComponent(mensaje);
        let numeroWhatsApp = "593963372269"; 

        window.location.href = `https://wa.me/${numeroWhatsApp}?text=${mensajeCodificado}`;
    }
</script>

</body>
</html>
