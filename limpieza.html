<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador y Reserva | Limpieza Profesional</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        /* Imagen adaptativa para móviles */
        .banner-img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin-bottom: 20px;
            object-fit: cover;
        }

        .service-group {
            margin-bottom: 15px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
        }

        .service-checkbox {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            gap: 10px;
        }

        .service-checkbox input {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            flex-shrink: 0;
        }

        .sub-options {
            margin-top: 12px;
            padding-left: 0;
            border-top: 1px dashed var(--border-color);
            padding-top: 10px;
            display: none;
        }

        .sub-options.active {
            display: block;
        }

        .sub-options label {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 5px;
        }

        .sub-options input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #f8fafc;
        }

        .total-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #f1f5f9;
            border-radius: 8px;
            text-align: center;
        }

        .total-box h3 {
            margin: 0;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .total-price {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            margin: 5px 0 0 0;
        }

        .btn-submit {
            display: block;
            width: 100%;
            margin-top: 20px;
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-submit:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Solicita tu Servicio de Limpieza Profesional</h1>
    <p class="subtitle">Selecciona los servicios que necesitas y calcula tu precio al instante.</p>
    
    <!-- Imagen adaptada -->
    <img src="wisholimpio.jpg" alt="Limpieza Profesional Kat Haus" class="banner-img">

    <form id="cotizadorForm">
        
        <!-- Opción 1: Juego de Sala -->
        <div class="service-group">
            <label class="service-checkbox">
                <span>🛋️ Juego de Sala (Base 7 puestos) - $35</span>
                <input type="checkbox" id="checkSala" onchange="toggleSub('salaOptions', this)">
            </label>
            <div id="salaOptions" class="sub-options">
                <label for="extraPuestos">¿Necesitas puestos adicionales? (+$5 c/u)</label>
                <input type="number" id="extraPuestos" value="0" min="0" max="10" oninput="calcularTotal()">
            </div>
        </div>

        <!-- Opción 2: Colchón 2 Plazas -->
        <div class="service-group">
            <label class="service-checkbox">
                <span>🛏️ Colchón de 2 Plazas - $22</span>
                <input type="checkbox" id="checkColchon2P" value="22" onchange="calcularTotal()">
            </label>
        </div>

        <!-- Opción 3: Colchón King Size -->
        <div class="service-group">
            <label class="service-checkbox">
                <span>🛏️ Colchón King Size - $32</span>
                <input type="checkbox" id="checkColchonKing" value="32" onchange="calcularTotal()">
            </label>
        </div>

        <!-- Caja de Total -->
        <div class="total-box">
            <h3>Precio Estimado Total</h3>
            <p class="total-price" id="totalDisplay">$0</p>
        </div>

        <!-- Botón de Acción -->
        <button type="button" class="btn-submit" onclick="reservarCupo()">💬 Reservar por WhatsApp</button>
    </form>
</div>

<script>
    function toggleSub(id, checkbox) {
        const subOptions = document.getElementById(id);
        if (checkbox.checked) {
            subOptions.classList.add('active');
        } else {
            subOptions.classList.remove('active');
            document.getElementById('extraPuestos').value = 0; 
        }
        calcularTotal();
    }

    function calcularTotal() {
        let total = 0;

        const checkSala = document.getElementById('checkSala');
        if (checkSala.checked) {
            let baseSala = 35;
            let extraPuestos = parseInt(document.getElementById('extraPuestos').value) || 0;
            total += baseSala + (extraPuestos * 5);
        }

        const checkColchon2P = document.getElementById('checkColchon2P');
        if (checkColchon2P.checked) {
            total += parseInt(checkColchon2P.value);
        }

        const checkColchonKing = document.getElementById('checkColchonKing');
        if (checkColchonKing.checked) {
            total += parseInt(checkColchonKing.value);
        }

        document.getElementById('totalDisplay').innerText = '$' + total;
    }

    function reservarCupo() {
        let total = document.getElementById('totalDisplay').innerText;
        if (total === '$0') {
            alert('Por favor selecciona al menos un servicio para continuar.');
            return;
        }
        
        let detalleItems = [];
        
        const checkSala = document.getElementById('checkSala');
        if (checkSala.checked) {
            let extraPuestos = parseInt(document.getElementById('extraPuestos').value)효 || parseInt(document.getElementById('extraPuestos').value) || 0;
            let descSala = "- Juego de Sala (Base 7 puestos)";
            if (extraPuestos > 0) {
                descSala += ` con ${extraPuestos} puesto(s) adicional(es)`;
            }
            detalleItems.push(descSala);
        }

        const checkColchon2P = document.getElementById('checkColchon2P');
        if (checkColchon2P.checked) {
            detalleItems.push("- Colchón de 2 Plazas ($22)");
        }

        const checkColchonKing = document.getElementById('checkColchonKing');
        if (checkColchonKing.checked) {
            detalleItems.push("- Colchón King Size ($32)");
        }

        let mensaje = `Hola! Quiero reservar el servicio de limpieza con los siguientes detalles:\n\n` +
                      detalleItems.join('\n') + `\n\n` +
                      `*Precio Estimado Total: ${total}*`;

        let mensajeCodificado = encodeURIComponent(mensaje);
        let numeroWhatsApp = "593963372269"; 

        window.location.href = `https://wa.me/${numeroWhatsApp}?text=${mensajeCodificado}`;
    }
</script>

</body>
</html>
