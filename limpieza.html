<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador y Reserva | Limpieza Profesional</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .service-group {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: border-color 0.2s;
        }

        .service-group:hover {
            border-color: var(--primary);
        }

        .service-checkbox {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-weight: bold;
        }

        .service-checkbox input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .sub-options {
            margin-top: 12px;
            padding-left: 28px;
            display: none;
        }

        .sub-options.active {
            display: block;
        }

        .sub-options label {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 5px;
        }

        .sub-options select, .sub-options input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .total-box {
            margin-top: 30px;
            padding: 20px;
            background-color: #f1f5f9;
            border-radius: 8px;
            text-align: center;
        }

        .total-box h3 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .total-price {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--primary);
            margin: 5px 0 0 0;
        }

        .btn-submit {
            display: block;
            width: 100%;
            margin-top: 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            text-decoration: none;
        }

        .btn-submit:hover {
            background-color: var(--primary-dark);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cotiza tu Limpieza Profesional</h1>
    <p class="subtitle">Selecciona los servicios que necesitas y calcula tu precio al instante.</p>

    <form id="cotizadorForm">
        
        <!-- Opción 1: Juego de Sala -->
        <div class="service-group">
            <label class="service-checkbox">
                <span>🛋️ Juego de Sala (Base 7 puestos) - $35</span>
                <input type="checkbox" id="checkSala" onchange="toggleSub('salaOptions', this)">
            </label>
            <div id="salaOptions" class="sub-options">
                <label for="extraPuestos">¿Necesitas puestos adicionales? (+$5 c/u)</label>
                <input type="number" id="extraPuestos" value="0" min="0" max="10" oninput="calcularTotal()">
            </div>
        </div>

        <!-- Opción 2: Colchón 2 Plazas -->
        <div class="service-group">
            <label class="service-checkbox">
                <span>🛏️ Colchón de 2 Plazas - $22</span>
                <input type="checkbox" id="checkColchon2P" value="22" onchange="calcularTotal()">
            </label>
        </div>

        <!-- Opción 3: Colchón King Size -->
        <div class="service-group">
            <label class="service-checkbox">
                <span>🛏️ Colchón King Size - $32</span>
                <input type="checkbox" id="checkColchonKing" value="32" onchange="calcularTotal()">
            </label>
        </div>

        <!-- Caja de Total -->
        <div class="total-box">
            <h3>Precio Estimado Total</h3>
            <p class="total-price" id="totalDisplay">$0</p>
        </div>

        <!-- Botón de Acción -->
        <button type="button" class="btn-submit" onclick="reservarCupo()">Reservar cupo</button>
    </form>
</div>

<script>
    function toggleSub(id, checkbox) {
        const subOptions = document.getElementById(id);
        if (checkbox.checked) {
            subOptions.classList.add('active');
        } else {
            subOptions.classList.remove('active');
            document.getElementById('extraPuestos').value = 0; // Resetear puestos extra si desmarca
        }
        calcularTotal();
    }

    function calcularTotal() {
        let total = 0;

        // Sala (Base 35 + 5 por cada puesto extra)
        const checkSala = document.getElementById('checkSala');
        if (checkSala.checked) {
            let baseSala = 35;
            let extraPuestos = parseInt(document.getElementById('extraPuestos').value) || 0;
            total += baseSala + (extraPuestos * 5);
        }

        // Colchón 2 Plazas
        const checkColchon2P = document.getElementById('checkColchon2P');
        if (checkColchon2P.checked) {
            total += parseInt(checkColchon2P.value);
        }

        // Colchón King
        const checkColchonKing = document.getElementById('checkColchonKing');
        if (checkColchonKing.checked) {
            total += parseInt(checkColchonKing.value);
        }

        document.getElementById('totalDisplay').innerText = '$' + total;
    }

    function reservarCupo() {
        let total = document.getElementById('totalDisplay').innerText;
        if (total === '$0') {
            alert('Por favor selecciona al menos un servicio para continuar.');
            return;
        }
        
        // Aquí puedes redirigir a WhatsApp pasando el total o abrir un modal de pago/reserva
        alert('¡Excelente! Tu cotización es de ' + total + '. Redirigiendo para coordinar tu reserva...');
        // Ejemplo para conectar a WhatsApp (descomenta y cambia el número):
        // window.location.href = `https://wa.me/5939XXXXXXXX?text=Hola,%20quiero%20reservar%20el%20servicio%20por%20un%20total%20de%20${total}`;
    }
</script>

</body>
</html>
